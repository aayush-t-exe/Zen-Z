name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  lint-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/admin

  lint-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/mobile

  lint-marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/marketing

  typecheck-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=apps/admin

  typecheck-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # expo-env.d.ts is deliberately gitignored (Expo regenerates it,
      # normally on `expo start`/`expo prebuild`) — CI never runs those, so
      # without this the `/// <reference types="expo/types" />` that makes
      # `@/global.css`'s side-effect import resolvable is simply missing,
      # and tsc fails with TS2882 on a fresh checkout even though it's fine
      # locally once you've ever run the app once.
      - run: printf '/// <reference types="expo/types" />\n' > apps/mobile/expo-env.d.ts
      - run: npm run typecheck --workspace=apps/mobile

  typecheck-marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=apps/marketing

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=apps/admin

  # Lint + typecheck alone already missed a real production-only failure
  # once (the React 19 hoisting incident, see docs/ARCHITECTURE.md) — a
  # change can pass both and still fail to build. These are the dev
  # project's publishable anon key/URL (safe to commit, matches the same
  # values already hardcoded in apps/mobile/eas.json's preview profile) —
  # this job only proves the build compiles, it deploys nothing.
  build-admin:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vsdztarpdmeaxfrtxtcz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_h3JitSz-Jg36NvUzquQz4A_evcoAkIW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/admin

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=apps/mobile

  test-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:functions

  # pgTAP tests run directly against the linked campus-social-dev project
  # (`supabase db query --linked`) — there's no local Docker stack and no
  # staging tier yet (docs/ARCHITECTURE.md). Every test file wraps its
  # assertions in begin/rollback, so nothing is left behind, but two PRs
  # running this at once would still race on the same shared dev DB — the
  # concurrency group below serializes them (queues, doesn't cancel) instead.
  test-db:
    runs-on: ubuntu-latest
    concurrency:
      group: pgtap-dev-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to match the version this test harness was validated
          # against locally (`npx supabase --version`) — `latest` risks a
          # CLI output-shape change (e.g. `db query --output-format json`)
          # silently breaking scripts/test-db.mjs's parsing.
          version: 2.113.0
      - run: supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      - run: npm run test:db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
